<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="testRequest()">Reder Fetch a BackEnd</button>
    

    <div id="content">
        <!-- Aqui vamos a renderizar la data que consultamos al backEnd -->
    </div>


    <!-- Include Handlebars from a CDN -->
    <script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>

    <!-- Creamos una plantilla para hacer el mapeo de la data -->
    <script id="usersTemplate" type="text/x-handlebars-template">
            <div>
                <h1>Usuarios en el Sistema (sin datos sensibles)</h1>
                <ul>
                    {{#each students}}
                        <li>
                            <p>{{name}} {{lastName}}</p>
                            
                            <p>{{email}}</p>
                            <p>role: {{role}}</p>
                        </li>
                    {{/each}}
                </ul>
            </div>
        </script>

     <script src="index.js"></script>

</body>
</html>
